# max_workers: 36  # hard cap on parallel workers (I/O, plotting, scoring)

evaluation:
  metrics  : 
  - rmse
  - mae
  - psd:
        psd_method: "sht"                    # "sht" (SHT-based, default) or "fft" (regrid FFT)
        # psd_regrid_resolution: 1.0           # degrees, only for fft method
  # metrics  : ["rmse", "mae"]
  # regions: ["global", "nhem"] # Have regions here, if you want for them to apply to all streams (scores calculation)
  summary_plots : true
  ratio_plots : false
  heat_maps : true
  summary_dir: "./plots_agg_sample/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: true #plot scores on a 2D maps. it slows down score computation
  plot_score_animations: true #plot animations of score maps across forecast steps. it slows down score computation
  plot_score_init_timeseries: true #plot timeseries of scores across forecast steps.
  print_summary: true #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: true
  bar_plots: true
  # baseline: "ar40mckx"


default_streams:
  ERA5:
    #offset: "1h" #optional: specify a timedelta offset to infer init_time when source_interval is missing. Format examples: "1h", "30m", "2h30m".
    regions: ["global"]
    channels: ["2t", "10u"] #, "10v", "z_500", "t_850", "u_850", "v_850", "q_850", ]
    regrid: False
    #  original_grid: [1.0, 1.0] #default is [1.5, 1.5], e.g. ["O96"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: "all" #representative subset across the daily-init range; scoring above stays "all"
      forecast_step: "all" #every 24h out to the 96h horizon (6h steps); supports "all", [1,2,3,...], "1-50"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      plot_maps: true
      plot_bias: true
      plot_target: false
      plot_histograms: true
      plot_animations: true
      plot_timeseries: true

run_ids :
  era5_1deg_daily96h:
    label: "8layer, 1deg, 2020, daily 00Z init, 96h horizon"
    # results_base_dir : "/home/sagemaker-user/weathergen_shared/results/8layer_1deg_2020"
    #NEW: if "streams" is not specified, the default streams are used
    agg_dims: sample #average scores across the sample (forecast init) dimension
    metrics_dir: "/home/sagemaker-user/weathergen_shared/results/era5_1deg_daily96h/evaluation_agg_sample"
    
  
  