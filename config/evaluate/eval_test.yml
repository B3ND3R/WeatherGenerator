#optional: if commented out all is taken care of by the default settings
# NB. global options apply to all run_ids

#global_plotting_options:
#  regions: ["europe", "global"] # Have regions here, if you want for them to apply to all streams (map generation)
#  image_format : "png" #options: "png", "pdf", "svg", "eps", "jpg" ..
#  animation_format: "gif" #options: "mp4", "gif" -- default is already gif, fps 2
#  dpi_val : 300
#  fps: 2

# max_workers: 36  # hard cap on parallel workers (I/O, plotting, scoring)

evaluation:
  # NB: don't add psd (or any non-2D-map metric) here alongside score_map/score_animation/
  # timeseries below -- see docs/wfp_sagemaker_setup.md #4 for why that silently breaks those
  # outputs for rmse/mae whenever psd's cache goes stale relative to theirs.
  metrics:
  - rmse
  - mae

  # ── Score visualisations (new list-based config) ──
  # lead_time       -> RMSE (etc.) vs forecast lead time, averaged over all forecasts
  # timeseries      -> score vs init hour of day, one figure per forecast step
  # score_map       -> spatial error maps per forecast step (prerequisite for score_animation)
  # score_animation -> animates score_map across the forecast window into a GIF
  # heatmap/scorecard/bar -> extra summary views
  score_plots: [lead_time, timeseries, score_map, score_animation, heatmap, scorecard, bar]

  # Absolute, run-scoped path -- keeps this run's summary plots out of the shared,
  # cwd-relative ./plots/ folder (which any evaluate invocation from the repo root writes into,
  # mixing output from every run_id you've ever evaluated). Matches where the per-sample/
  # score-map output already lands via runplot_dir.
  summary_dir: "/home/sagemaker-user/weathergen_shared/results/era5_1deg_daily96h/plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  print_summary: true #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  # baseline: "ar40mckx"


default_streams:
  ERA5:
    #offset: "1h" #optional: specify a timedelta offset to infer init_time when source_interval is missing. Format examples: "1h", "30m", "2h30m".
    regions: ["global"]
    channels: ["2t", "10u"] #, "10v", "z_500", "t_850", "u_850", "v_850", "q_850", ]
    regrid: False
    #  original_grid: [1.0, 1.0] #default is [1.5, 1.5], e.g. ["O96"]
    evaluation:
      forecast_step: "all"   # score every forecast step (needed for full lead-time/GIF coverage)
      sample: "all"          # score every forecast (needed to average over "all forecasts")
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: [0, 2, 4, 6]               # one sample from each init hour: 0->06Z, 2->12Z, 4->18Z, 6->00Z
      forecast_step: [1, 4, 8, 12, 16]  # every 24h out to the 96h horizon (6h steps)
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      # ── Data visualisations (new list-based config) ──
      # per-sample maps/bias/histograms/animations -- separate from the score plots above,
      # kept on but restricted to the subset above to stay fast.
      data_plots: [maps, bias, histograms, animations, timeseries]

run_ids :
  era5_1deg_daily96h:
    label: "8layer, 1deg, 2020, 6-hourly init (00/06/12/18Z), 96h horizon"
    # results_base_dir : "/home/sagemaker-user/weathergen_shared/results/8layer_1deg_2020"
    #NEW: if "streams" is not specified, the default streams are used
