# Evaluation config for daily precipitation runs at the WFP Mozambique rain gauges, made with
# extreme-weather-forecasting/scripts/accumulate_daily_run.py. That script turns an offgrid run of a
# 6-hourly precipitation model (ibpnc1py, frdw62xn, bt06u8hd, zjvuanq7) into daily totals (lead
# days 1-8 of the 00 UTC forecasts) with the gauge totals as targets, in a stream renamed to CHIRPS,
# so all models are plotted together with the daily CHIRPS decoders (e.g. zjk1udv3). The label of a
# run says which model it is.
#
#   uv run --offline evaluate --config config/evaluate/eval_config_daily_gauges.yml
#
# The converted runs are not in shared_work: give results_base_dir and model_base_dir per run, as
# printed by accumulate_daily_run.py. Metrics and plots are written to results_base_dir.
max_workers: 1

global_plotting_options:
  image_format: "png"
  animation_format: "gif"
  dpi_val: 300
  fps: 2

  CHIRPS:
    add_admin0_bounds: true
    add_admin1_bounds: true
    marker_size: 50
    scale_marker_size: false
    marker: "o"
    # CHIRPS and gauge 'tp' are daily totals in mm
    "tp*":
      colorbar_scale: "linear"
      vmin: -30.0
      vmax: 30.0
      levels: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0] # mm/day
      colors:
        - "none" # < 0.1 mm/day: dry, drawn transparent
        - "#BEDAE5BF"
        - "#80B5CCBF"
        - "#5691B3BF"
        - "#4B6E9CBF"
        - "#424B83BF"
        - "#45596DBF"
        - "#5B9E4CBF" # > 20 mm/day

evaluation:
  metrics: ["rmse", "mae"]
  score_plots: [metric_plots]
  summary_dir: "./plots_daily_gauges/"
  plot_ensemble: false
  plot_score_animations: false # broken on develop, see wegen_inference_and_eval.md section 15
  print_summary: true

default_streams:
  CHIRPS:
    regions: ["moz"]
    channels: ["tp"]
    evaluation:
      forecast_step: "all"
      sample: "all"
    plotting:
      sample: [0]
      forecast_step: "all"
      data_plots:
        - maps:
            predictions: [image]
            target: [image]
            bias: [image]

run_ids:
  # accumulate_daily_run.py prints the entry of each converted run, e.g.
  # <inference_id>_daily:
  #   label: "ibpnc1py (ERA5_TP) daily vs gauges"
  #   results_base_dir: /e/project1/e-ext-2025e01-128/bender3/results/results/<inference_id>_daily
  #   model_base_dir: /e/project1/e-ext-2025e01-128/bender3/results/models
  # zjk1udv3 (CHIRPS decoder) at the gauges, for comparison
  rtn01cow:
    label: "zjk1udv3 (CHIRPS) vs gauges"
    results_base_dir: /e/project1/e-ext-2025e01-128/bender3/git/WeatherGenerator/results/rtn01cow
