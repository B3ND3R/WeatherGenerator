# Overwrite config for a single inference run of a CHIRPS decoder (e.g. zjk1udv3) with CHIRPS
# predicted at the Mozambique rain gauge stations instead of on its grid. ERA5 stays on its grid.
# Use it together with --from-run-id, e.g.
#
#   uv run --offline inference --from-run-id zjk1udv3 --config config/config_chirps_offgrid_inference.yml
#
# Streams are inherited from the config of the trained model; only the reader of CHIRPS is
# switched to the offgrid one (see data_reader_offgrid.py). Do not set streams_directory in this
# file: that would replace the inherited streams instead of extending them. For the same run on
# the grid see config_chirps_grid_inference.yml.

test_config:
  # one forecast needs (num_steps + offset + 1) = 10 daily windows after its init, so leave at
  # least 11 days; the number of forecasts is set by samples_per_mini_epoch
  start_date: 2023-06-01T00:00
  end_date: 2023-06-15T00:00
  samples_per_mini_epoch: 1
  output:
    num_samples: 1

data_loading:
  # the sample count is rounded down to a multiple of batch_size * num_workers; with more workers
  # than samples nothing is run
  num_workers: 1

streams:
  CHIRPS:
    type: offgrid
    # reader type the stream was trained with; provides channels and normalization
    base_type: chirps
    offgrid:
      # (N, 2) array of [lat, lon] in degrees of the stations
      coords: /e/project1/e-ext-2025e01-128/bender3/data/moz_stations/latlon.npy
      # CHIRPS has no geoinfo channels, so no geoinfos are needed
      # CHIRPS days are labelled at 23:00 (daily_anchor) and the decoder sees the time of day of
      # its targets, so the station points are labelled the same way
      time_offset: 23h
