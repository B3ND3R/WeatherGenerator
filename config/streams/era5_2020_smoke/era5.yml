    - "z_250"
    - "z_400"
    - "z_600"
    - "z_750"
    - "z_925"
    - "z_1000"
  geoinfo_channels : ["z", "lsm", "slor", "sdor"]
  diagnostic : False
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: -1
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
