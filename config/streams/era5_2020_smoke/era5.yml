# Stream config pointing at the custom ERA5 2020 zarr built via anemoi-datasets + CDS
# (see /home/sagemaker-user/git/anemoi-sandbox/recipe.yaml). source/target explicitly
# list all 48 dynamic channels in the zarr; the 4 static fields below are geoinfo only.
# Embed dims sized to match config/streams/era5_1deg/era5.yml's full-channel production
# setup rather than the earlier 6-channel smoke-test sizing.

ERA5 :
  type : anemoi
  stream_id: 0
  filenames : ['/home/sagemaker-user/data/era5/era5_1deg_2020.zarr']
  loss_weight : 1.
  source :
    - "2t"
    - "10u"
    - "10v"
    - "q_2"
    - "q_50"
    - "q_150"
    - "q_250"
    - "q_400"
    - "q_600"
    - "q_750"
    - "q_925"
    - "q_1000"
    - "t_2"
    - "t_50"
    - "t_150"
    - "t_250"
    - "t_400"
    - "t_600"
    - "t_750"
    - "t_925"
    - "t_1000"
    - "u_2"
    - "u_50"
    - "u_150"
    - "u_250"
    - "u_400"
    - "u_600"
    - "u_750"
    - "u_925"
    - "u_1000"
    - "v_2"
    - "v_50"
    - "v_150"
    - "v_250"
    - "v_400"
    - "v_600"
    - "v_750"
    - "v_925"
    - "v_1000"
    - "z_2"
    - "z_50"
    - "z_150"
    - "z_250"
    - "z_400"
    - "z_600"
    - "z_750"
    - "z_925"
    - "z_1000"
