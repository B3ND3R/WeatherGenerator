# Stream config pointing at the synthetic dataset generated by make_dummy_dataset.py.
# Modeled on integration_tests/streams/era5_small.yml.

ERA5 :
  type : anemoi
  stream_id: 0
  filenames : ['/Users/matt/data/dummy_era5.zarr']
  loss_weight : 1.
  source : ["2t", "10u", "10v", "z_500", "t_850", "q_850"]
  target : ["2t", "z_500", "t_850"]
  diagnostic : False
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 32
  tokenize_spacetime : True
  max_num_targets: -1
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 2
    dim_embed : 16
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 16
  target_readout :
    num_layers : 2
    num_heads : 2
  pred_head :
    ens_size : 1
    num_layers : 1
