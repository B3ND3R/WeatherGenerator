# Minimal, fast, single-GPU training config for exercising `evaluate` end-to-end
# with no real ERA5 access. Based on integration_tests/small1.yml, sized to fit
# comfortably on a single 24GB GPU (e.g. NVIDIA A10G) and pointed at a synthetic
# but structured (not white-noise) 1-degree-resolution dataset produced by
# dummy_run/make_dummy_dataset.py, so that its shape/density matches real ERA5
# at 1deg (see config/streams/era5_1deg) and plots look like plausible weather.
#
# Requires the GPU extra (flash-attention needs an NVIDIA GPU + CUDA):
#   uv sync --extra gpu
#
# `train`/`inference`/`evaluate` always look up a "private repo" for
# platform/secrets info (see packages/common/src/weathergen/common/paths.py and
# dummy_run/hpc/platform-env.py), even when --private-config is passed
# explicitly, so both of these env vars must be set for every command below:
#   export WEATHERGEN_PRIVATE_REPO_PATH=./dummy_run
#   export WEATHERGEN_PRIVATE_CONF=./dummy_run/private_config.yml
#
# Run from repo root:
#   uv run python dummy_run/make_dummy_dataset.py
#   uv run train --private-config dummy_run/private_config.yml \
#     --base-config=dummy_run/train_config.yml --run-id dummy1
#   uv run inference --private-config dummy_run/private_config.yml \
#     --base-config=dummy_run/train_config.yml --from-run-id dummy1 --mini-epoch 1 --run-id dummy1
#   uv run evaluate --config dummy_run/eval_config.yml
#
# (--mini-epoch: this short run only writes a couple of checkpoints, not a
# "*_latest.chkpt"; check `ls models/dummy1/` and pick the highest chkpt index.)
#
# CPU-only (e.g. on a Mac with no NVIDIA GPU)? Use git history for the older
# CPU-friendly version of this file (with_flash_attention/with_mixed_precision:
# False), or override on the command line, e.g.:
#   uv run train ... --options with_flash_attention=False with_mixed_precision=False

embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 512
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 512
ae_global_num_blocks: 2
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 2
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 2
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0

healpix_level: 4

# Single-GPU: mixed precision + flash-attention enabled (needs NVIDIA GPU + CUDA).
# FSDP is for sharding across multiple GPUs, so it stays off here.
with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""

norm_type: "LayerNorm"

zarr_store: "zip"

################

streams_directory: "./dummy_run/streams/"
model_path: "./models"
results_path: "./results"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading :
  num_workers: 2
  rng_seed: ???
  repeat_data_in_mini_epoch : False
  memory_pinning: True

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 1
  samples_per_mini_epoch: 16
  shuffle: True

  start_date: 2020-01-01T00:00
  end_date: 2020-02-10T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  window_offset_prediction : 1

  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 0.00005
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 2
    num_steps_cooldown: 2
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      beta1 : 0.975
      beta2 : 0.9875
      eps : 2e-08

  losses : {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input: {
    "forecasting" : {
      masking_strategy: "forecast",
    }
  }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      policy: "fixed"
      offset: 1


validation_config:

  samples_per_mini_epoch: 8
  shuffle: False

  start_date: 2020-02-10T00:00
  end_date: 2020-02-20T00:00

  output:
    streams: ["ERA5"]

  validate_with_ema:
    enabled : True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

test_config:
  start_date: 2020-02-20T00:00
  end_date: 2020-02-29T00:00
  output:
    num_samples: 10

inference_config:
  output:
    streams: ["ERA5"]

wgtags:
  org: null
  issue: null
  exp: null
  grid: null
